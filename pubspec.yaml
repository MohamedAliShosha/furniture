name: furniture
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: null
  google_fonts: null
  equatable: ^2.0.5
  shared_preferences: null
  uuid: 
  intl:
  timeago: ^3.7.1 
  firebase_core: ^4.7.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter


flutter:

  
  uses-material-design: true
  
  assets:
    - assets/images/beds/
    - assets/images/chairs/
    - assets/images/decoration/
    - assets/images/lights/
    - assets/images/sofa/
    - assets/images/tables/
    - assets/images/
    - assets/images/blogs/
    - assets/icons/
  
  # fonts:
